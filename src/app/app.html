<div class="min-h-screen flex flex-col bg-[#0b0f17] text-[#e2e8f0] selection:bg-indigo-500 selection:text-white">
  
  <!-- Global Application Header -->
  <app-header (openQuickSearch)="openQuickSearch()" />

  <!-- Main Application Body: Sidebar + Dynamic Route Outlet -->
  <div class="flex-1 flex flex-row overflow-hidden">
    <!-- Sidebar Navigation -->
    <app-sidebar 
      (openArchitecture)="openArchitectureModal()" 
      class="hidden md:flex flex-col"
    />

    <!-- Main Content Area with Scroll Container -->
    <main class="flex-1 overflow-y-auto bg-[#0b0f17] min-h-[calc(100vh-3.5rem)]">
      <router-outlet />
    </main>
  </div>

  <!-- Global Toast Feedback Notifications -->
  <app-toast />

  <!-- Global Command Palette Modal (⌘K / Ctrl+K) -->
  <app-quick-search 
    [isOpen]="isQuickSearchOpen()" 
    (close)="closeQuickSearch()" 
  />

  <!-- Interactive Angular Architecture Spec Modal -->
  <app-architecture-modal 
    [isOpen]="isArchitectureModalOpen()" 
    (close)="closeArchitectureModal()" 
  />

</div>
